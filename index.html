<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" name="viewport"/>
<title>Navodayan Chat</title>
<link rel="stylesheet" href="css/layout.css"/>
<link rel="stylesheet" href="css/landing.css"/>
</head>
<body>
<div aria-label="Navodayan Chat welcome page" id="navodayan-landing" role="main">
<section class="landing-card">
<div aria-hidden="true" class="landing-mark">
<svg fill="none" height="42" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.7" viewbox="0 0 48 48" width="42">
<path d="M24 13v25M24 13c-5-4-11-4-16-1v24c5-3 11-3 16 2M24 13c5-4 11-4 16-1v24c-5-3-11-3-16 2"></path>
<path d="m24 3 3.2 6.2 6.8 1-5 4.8 1.2 6.8-6.2-3.2-6.2 3.2 1.2-6.8-5-4.8 6.8-1L24 3Z" fill="rgba(251,191,36,.22)"></path>
</svg>
</div>
<div class="landing-eyebrow">One School · One Family</div>
<h1>NAVODAYAN<br/>CHAT</h1>
<p class="landing-subtitle">Reconnect with your Navodaya family, relive the hostel memories, and meet friends from every generation.</p>
<div class="landing-divider">✦ ✧ ✦</div>
<div class="landing-motto">Same School<br/>Different Generations<br/><strong>One Bond. Always.</strong></div>
<button class="start-chat-btn" id="startNavodayanChat" type="button">▶   Start Chat</button>
<div class="landing-foot">Once a Navodayan · Always a Navodayan</div>
</section>
</div>
<script src="js/landing.js"></script>

<script id="navodayan-cloud-config" src="js/config.js"></script>
<iframe class="ui-frame" id="desktop-ui" title="Navodayan Chat desktop" src="desktop.html" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
<iframe class="ui-frame" id="mobile-ui" title="Navodayan Chat mobile" src="mobile.html" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
</body>
</html>
